name: Bug Report
description: Create a report to help us reproduce and fix a bug.
title: "fix: [Short description of the bug]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please ensure you have read the `CONTRIBUTING.md` and checked for existing duplicate issues before proceeding.
  
  - type: checkboxes
    id: pre-flight
    attributes:
      label: Pre-flight checks
      options:
        - label: I have checked existing open and closed issues for duplicates.
          required: true
        - label: I am using the latest version of the application.
          required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Browser and OS version, and how the application was opened.
      placeholder: e.g., Firefox on Windows, opened from a local file
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide a clear, step-by-step algorithm to trigger the bug.
      placeholder: |
        1. Enter the following sample data...
        2. Select the check mode and run the check...
        3. Observe the result...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect the script/action to do?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually occurred? Include any relevant error messages.
      render: shell
    validations:
      required: true
